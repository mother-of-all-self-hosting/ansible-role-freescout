---
- name: Verify FreeScout
  hosts: all
  become: true
  gather_facts: false

  vars:
    # FreeScout refuses any request whose Host header is not the one APP_URL
    # names, answering 403 "Untrusted Host" for every path. Deriving the base
    # URL from the very variable that becomes APP_URL is what keeps the probes
    # below testing FreeScout rather than that refusal.
    freescout_verify_base_url: "{{ freescout_environment_variables_site_url | regex_replace('/$', '') }}"

    # Tables that `php artisan migrate` creates. Their presence in the database
    # this scenario wired up is what tells a migrated FreeScout apart from one
    # that found some other database, or none.
    freescout_verify_expected_tables:
      - conversations
      - mailboxes
      - migrations
      - users

    # The command prefix that runs a single SQL statement inside the database
    # container this scenario started, printing bare values with no headers.
    #
    # The docker CLI is invoked directly here and below: the ansible-lint
    # environment used by pre-commit has no collections installed, so
    # community.docker.* would fail the playbook syntax check.
    freescout_verify_db_command: >-
      {{
        (
          'docker exec ' ~ (mariadb_identifier | default('mariadb')) ~
          ' mariadb --user=' ~ (freescout_database_mysql_username | quote) ~
          ' --password=' ~ (freescout_database_mysql_password | quote) ~
          ' --batch --skip-column-names ' ~ (freescout_database_name | quote) ~ ' -e '
        ) if freescout_database_type == 'mysql' else (
          'docker exec --env=PGPASSWORD=' ~ (freescout_database_postgres_password | quote) ~
          ' ' ~ (postgres_identifier | default('postgres')) ~
          ' psql -U ' ~ (freescout_database_postgres_username | quote) ~
          ' -d ' ~ (freescout_database_name | quote) ~ ' -tAc '
        )
      }}

    freescout_verify_tables_query: >-
      SELECT table_name FROM information_schema.tables
      WHERE table_schema = {{ "DATABASE()" if freescout_database_type == 'mysql' else "'public'" }}

  tasks:
    - name: Run the shared FreeScout verification
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"
